name: gpx_core
description: Core logic and BLoC for handling GPX files.
version: 0.0.1
homepage:
publish_to: 'none' 

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.4
  equatable: ^2.0.5 #建議搭配 bloc 使用
  flutter_lints: ^6.0.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.4
  xml: ^6.5.0
  path_provider: ^2.1.5
  file_saver: ^0.3.1
  intl: ^0.20.2
  open_file: ^3.5.10        # 用於開啟檔案
  permission_handler: ^12.0.1 # 用於處理權限
  share_plus: ^11.0.0 # 用於分享檔案
  flutter_speed_dial: ^7.0.0 # 浮動按鈕
  url_launcher: ^6.3.2 # 開啟網頁連結

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2


